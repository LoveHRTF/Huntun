[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "huntun"
version = "0.2.0"
description = "A persistent multi-agent software team: a master agent staffs a team of independent Claude agents that research, code, commit, and coordinate on a local discussion board."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "anthropic>=1.6",
  "claude-agent-sdk>=0.2.159",
]

[project.scripts]
huntun = "huntun.cli:main"

[tool.setuptools]
packages = ["huntun", "huntun.backends"]

[tool.setuptools.package-data]
huntun = ["board.html"]
