<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huntun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./performance.css">
<style>
  :root { --bg:#0b0e17; --panel:#131828; --panel2:#1a2036; --line:#2a3352; --ink:#05070d; --text:#e9ecf5; --muted:#8f98b8; --accent:#ffd23f; --cyan:#4fe3f0; --ok:#5cff8a; --warn:#ffb03f; --err:#ff5c7a; --me:#1e3a63; --pink:#ff7ad9;
         --px:"Press Start 2P", monospace; --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; font: 14px/1.5 var(--sans); background:var(--bg); color:var(--text); }
  h1 { font: 13px/1 var(--px); } h2 { font: 9px/1.4 var(--px); letter-spacing:.08em; color:var(--muted); margin:10px 0 8px; text-transform:uppercase; }
  h3 { font: 600 15px/1.35 var(--sans); margin:0 0 6px; }
  code, pre, .mono { font-family: var(--mono); font-size:12.5px; }
  header { display:flex; gap:12px; align-items:center; padding:0 18px; border-bottom:3px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; height:54px; box-shadow: 0 3px 0 var(--ink); }
  header h1 { margin:0; color:var(--accent); text-shadow: 2px 2px 0 var(--ink); } header h1 a { color:inherit; text-decoration:none; }
  header .goal { color:var(--muted); flex:1 3 0; min-width:40px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
  .counters { display:flex; gap:6px; align-items:center; font-family:var(--mono); font-size:12px; }
  .counters .c { border:2px solid var(--line); padding:3px 8px; color:var(--muted); background:var(--panel2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; } .counters .c b { color:var(--text); font-weight:600; }
  .counters .c.lim { flex-shrink:0; }                                              /* the limit chips stay readable; the totals give way first */
  .counters button.c { font:12px var(--mono); background:var(--panel2); box-shadow:none; letter-spacing:0; cursor:pointer; }
  .counters button.c:active { transform:none; } .counters button.c:hover { background:var(--panel); }
  @media (max-width: 1250px) { header .counters.limited .c:not(.lim) { display:none; } }
  .counters .c.lim { border-color:var(--warn); color:var(--warn); } .counters .c.lim b { color:var(--warn); }
  button { background:var(--accent); color:var(--ink); border:2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding:7px 12px; font: 600 12px/1 var(--sans); cursor:pointer; letter-spacing:.02em; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button.secondary { background:var(--panel2); color:var(--text); } button.danger { background:var(--err); color:var(--ink); } button.ok { background:var(--ok); }
  button.small { padding:4px 8px; font-size:11px; box-shadow: 2px 2px 0 var(--ink); }
  button:disabled { opacity:.5; cursor:default; }
  .pill { padding:3px 8px; font: 600 10px/1.3 var(--sans); border:2px solid var(--line); color:var(--muted); white-space:nowrap; text-transform:uppercase; letter-spacing:.04em; }
  .pill.on { color:var(--ok); border-color:var(--ok); } .pill.off { color:var(--warn); border-color:var(--warn); } .pill.err { color:var(--err); border-color:var(--err); } .pill.busy { color:var(--cyan); border-color:var(--cyan); }
  main { display:grid; grid-template-columns: 1fr; min-height: calc(100vh - 54px); }
  main.board { grid-template-columns: 250px minmax(0, 1fr) 290px; height: calc(100vh - 54px); }
  aside { border-right:3px solid var(--line); padding:12px; background:var(--panel); overflow:auto; }
  aside.right { border-right:0; border-left:3px solid var(--line); }
  section { padding:16px 22px; max-width: 1100px; width:100%; margin:0 auto; }
  main.board section { min-width:0; max-width:none; margin:0; overflow:auto; }
  .meta { color:var(--muted); font-size:12px; }
  .card { border:2px solid var(--line); background:var(--panel); padding:14px 16px; margin-bottom:12px; box-shadow: 4px 4px 0 var(--ink); }
  .md { line-height:1.55; } .md pre { background:#070a12; border:2px solid var(--line); padding:10px; overflow:auto; } .md code { background:#070a12; padding:0 4px; color:var(--cyan); }
  .md .mention { color:var(--accent); font-weight:600; } .md ul { margin:4px 0; padding-left:20px; } .md h3, .md h4 { margin:8px 0 4px; font-size:14px; } .md b { color:#fff; } .md i { color:var(--muted); }
  textarea, input, select { width:100%; background:#070a12; color:var(--text); border:2px solid var(--line); padding:8px 10px; font: 14px/1.4 var(--sans); }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:80px; resize:vertical; }
  form { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .hrow { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  a { color:var(--cyan); } .hint { color:var(--muted); font-size:12px; }
  .error { color:var(--err); white-space:pre-wrap; }
  label { font: 600 10px/1.4 var(--sans); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; } @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .blink { animation: blink 1s steps(2, start) infinite; } @keyframes blink { to { visibility: hidden; } }
  /* projects + picker */
  .ws { display:block; padding:12px 14px; border:2px solid var(--line); margin-bottom:10px; background:var(--panel); text-decoration:none; color:inherit; box-shadow: 4px 4px 0 var(--ink); }
  .ws:hover, .thread:hover { border-color:var(--accent); }
  .ws .path { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .browser { border:2px solid var(--line); background:#070a12; max-height:260px; overflow:auto; }
  .browser div { padding:5px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-family:var(--mono); font-size:12.5px; }
  .browser div:hover { background:var(--panel2); color:var(--accent); } .browser .up { color:var(--muted); }
  /* pixel avatars */
  .av { display:inline-block; width:40px; height:40px; flex:none; position:relative; image-rendering: pixelated; border:2px solid var(--ink); background:#ece7da; }
  .av svg { width:100%; height:100%; display:block; shape-rendering: crispEdges; }
  .av.sm { width:26px; height:26px; } .av.lg { width:80px; height:80px; border-width:3px; }
  .av .badge { position:absolute; right:-6px; bottom:-6px; font-size:11px; line-height:1; background:var(--panel); border:2px solid var(--ink); padding:1px; }
  .av.lg .badge { font-size:16px; }
  .av.working { animation: bob .6s steps(2, end) infinite; box-shadow: 0 0 0 2px var(--ok); }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .who { display:flex; align-items:center; gap:8px; min-width:0; } .who b { white-space:nowrap; color:#fff; font-weight:600; }
  /* team */
  .agent { display:flex; gap:10px; padding:8px; border:2px solid var(--line); margin-bottom:10px; cursor:pointer; align-items:flex-start; background:var(--panel2); box-shadow: 3px 3px 0 var(--ink); }
  .agent:hover { border-color:var(--accent); }
  .agent .body { min-width:0; flex:1; } .agent .name { display:flex; align-items:center; gap:6px; } .agent b { color:var(--accent); font-weight:600; }
  .agent .st { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .agent .nums { display:flex; gap:8px; font-family:var(--mono); font-size:11.5px; margin-top:3px; color:var(--muted); flex-wrap:wrap; } .agent .nums b { color:var(--cyan); font-weight:600; }
  .bar { height:9px; border:2px solid var(--line); background:#070a12; margin-top:5px; position:relative; }
  .bar i { display:block; height:100%; background: repeating-linear-gradient(90deg, var(--ok) 0 4px, #2fa85a 4px 6px); }
  .bar.warn i { background: repeating-linear-gradient(90deg, var(--warn) 0 4px, #b87a20 4px 6px); } .bar.hot i { background: repeating-linear-gradient(90deg, var(--err) 0 4px, #a8304a 4px 6px); }
  .bar em { position:absolute; right:3px; top:-3px; font-style:normal; font-family:var(--mono); font-size:10px; color:#fff; line-height:1; }
  .dots::after { content:"▖"; animation: dots .8s steps(4, end) infinite; color:var(--ok); display:inline-block; width:1.2em; text-align:left; }
  @keyframes dots { 0% { content:"▖"; } 25% { content:"▘"; } 50% { content:"▝"; } 75% { content:"▗"; } }
  .dot { display:inline-block; width:8px; height:8px; background:var(--muted); flex:none; }
  .dot.working, .dot.resuming { background:var(--ok); animation: blink .8s steps(2, start) infinite; } .dot.paused, .dot.retrying { background:var(--warn); } .dot.error, .dot.crashed { background:var(--err); } .dot.waiting { background:var(--cyan); }
  /* threads */
  .toolbar { display:flex; align-items:center; gap:10px; margin:4px 0 12px; flex-wrap:wrap; } .toolbar .sort { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .sort select { width:auto; font-size:12px; padding:4px 6px; }
  .thread { display:block; border:2px solid var(--line); margin-bottom:12px; background:var(--panel); box-shadow: 4px 4px 0 var(--ink); }
  .pending { position:sticky; top:0; z-index:4; display:flex; gap:10px; align-items:center; background:var(--warn); color:var(--ink); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); padding:7px 12px; margin-bottom:12px; font: 600 12px/1.3 var(--sans); cursor:pointer; } .pending b { font-weight:700; } .pending .go { margin-left:auto; text-decoration:underline; }
  .thread .head { display:flex; gap:12px; padding:12px 14px; cursor:pointer; align-items:flex-start; }
  .thread .head .txt { flex:1; min-width:0; }
  .thread .title { font-weight:600; font-size:15px; color:#fff; margin:2px 0 4px; }
  .thread .snip { color:var(--muted); font-size:13px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; white-space:pre-line; line-height:1.45; }
  .thread .count { color:var(--cyan); font-size:12px; white-space:nowrap; font-family:var(--mono); }
  .thread .replies { margin:0 14px 12px 58px; padding-left:12px; border-left:3px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  .thread .reply { display:flex; gap:8px; align-items:flex-start; font-size:13px; }
  .thread.open { border-color:var(--accent); }
  .thread .tag { font: 600 10px/1.4 var(--sans); color:var(--muted); border:1px solid var(--line); padding:1px 6px; margin-left:6px; text-transform:uppercase; }
  .thread .chat { border-top:2px solid var(--line); background:#0d1120; padding:12px 14px; }
  .chat .messages { max-height:540px; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px; }
  .msg { display:flex; gap:10px; align-items:flex-start; max-width:88%; }
  .msg.me { align-self:flex-end; flex-direction:row-reverse; }
  .msg .bubble { background:var(--panel2); border:2px solid var(--line); padding:8px 12px; min-width:0; box-shadow: 3px 3px 0 var(--ink); }
  .msg.me .bubble { background:var(--me); } .msg.first .bubble { border-color:var(--cyan); }
  .msg .bhead { display:flex; gap:8px; align-items:baseline; margin-bottom:2px; } .msg .bhead b { color:#fff; font-weight:600; }
  .chat .compose { border-top:2px solid var(--line); padding-top:10px; margin-top:10px; }
  .compose-wrap { position:relative; } .chat .compose textarea { min-height:60px; }
  .composer.top { margin-bottom:12px; }
  /* mention autocomplete */
  .mention-box { position:absolute; z-index:20; background:var(--panel2); border:2px solid var(--accent); min-width:240px; max-height:220px; overflow:auto; box-shadow: 4px 4px 0 var(--ink); }
  .mention-box div { padding:6px 10px; display:flex; gap:8px; align-items:center; cursor:pointer; } .mention-box div.sel, .mention-box div:hover { background:var(--line); }
  .mention-box .role { color:var(--muted); font-size:12px; margin-left:auto; }
  /* approval page */
  .approve-page { max-width: 980px; margin:0 auto; }
  .plan-agent { display:grid; grid-template-columns: 90px minmax(0, 1fr) 210px; gap:14px; padding:14px 16px; border:2px solid var(--line); background:var(--panel); box-shadow: 4px 4px 0 var(--ink); margin-bottom:12px; align-items:start; }
  .plan-agent.removed { opacity:.4; } .plan-agent .brief { line-height:1.5; } .plan-agent .why { color:var(--muted); font-size:12.5px; margin-top:6px; }
  .plan-agent .ctl { display:flex; flex-direction:column; gap:6px; } .plan-agent .ctl select { padding:5px 8px; font-size:13px; }
  .plan-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:8px 0 16px; }
  /* activity */
  .events { font-size:12.5px; color:var(--muted); } .events .ev { padding:7px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:flex-start; }
  .events .ev .t { min-width:0; line-height:1.4; } .events .ev b { color:var(--text); font-weight:600; }
  /* dialog */
  dialog { background:var(--panel); color:var(--text); border:3px solid var(--line); box-shadow: 8px 8px 0 var(--ink); width:min(1040px, 94vw); height:min(84vh, 820px); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.7); }
  .dlg { display:flex; flex-direction:column; height:100%; overflow:auto; } .dlg > * { flex-shrink:0; }
  .dlg .top { display:flex; gap:16px; padding:16px 18px; border-bottom:3px solid var(--line); align-items:flex-start; }
  .dlg .top .body { flex:1; min-width:0; }
  .dlg .title { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .dlg .title h3 { margin:0; font-size:18px; color:var(--accent); }
  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap:8px; padding:12px 18px; border-bottom:3px solid var(--line); background:var(--panel2); }
  .tile { border:2px solid var(--line); background:var(--panel); padding:8px 10px; box-shadow: 3px 3px 0 var(--ink); min-width:0; }
  .tile span { display:block; font: 600 9px/1.4 var(--sans); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .tile b { font-family:var(--mono); font-size:15px; color:#fff; font-weight:600; word-break:break-word; }
  .dlg .cols { display:grid; grid-template-columns: 1fr 1fr; border-bottom:3px solid var(--line); }
  .dlg .cols > div { padding:12px 18px; min-width:0; } .dlg .cols > div + div { border-left:3px solid var(--line); }
  .dlg .cols p { margin:4px 0; line-height:1.5; } .dlg .cols ul { margin:4px 0; padding-left:18px; }
  .dlg .tabs { display:flex; gap:6px; padding:10px 18px; border-bottom:3px solid var(--line); align-items:center; }
  .tabs button { background:var(--panel2); color:var(--muted); } .tabs button.on { background:var(--accent); color:var(--ink); }
  .dlg .log { flex:1; overflow:auto; padding:10px 18px; font-family:var(--mono); font-size:12px; }
  .dlg .log .e { padding:6px 8px; border-left:4px solid var(--line); margin-bottom:6px; white-space:pre-wrap; word-break:break-word; background:#070a12; line-height:1.45; }
  .dlg .log .e.tool { border-color:var(--cyan); } .dlg .log .e.result { color:var(--muted); } .dlg .log .e.text { border-color:var(--ok); }
  .dlg .log .e.cycle, .dlg .log .e.retry { border-color:var(--warn); } .dlg .log .e.error { border-color:var(--err); } .dlg .log .e.prompt { border-color:var(--pink); color:var(--muted); }
  .dlg .log .e .k { color:var(--muted); font-size:10.5px; margin-right:8px; }
  .notes { flex:1 0 auto; padding:10px 18px; }
  /* model providers */
  #provdlg, #postdlg, #setdlg { height:fit-content; max-height:min(86vh, 860px); width:min(760px, 94vw); }
  #postdlg form textarea { min-height:140px; }
  .provbody { padding:14px 18px; } .provbody form.card { margin:0; }
  .prov { border:2px solid var(--line); background:var(--panel2); padding:10px 12px; margin-bottom:10px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; display:flex; flex-direction:column; gap:3px; }
  .prov:hover, .prov:focus { border-color:var(--accent); outline:none; } .prov.env { cursor:default; } .prov.env:hover { border-color:var(--line); }
  .prov b { color:#fff; font-weight:600; } .prov .kind { font: 600 10px/1.4 var(--sans); color:var(--ink); background:var(--cyan); padding:1px 6px; text-transform:uppercase; letter-spacing:.04em; }
  .prov .tag { font: 600 10px/1.4 var(--sans); color:var(--muted); border:1px solid var(--line); padding:1px 6px; text-transform:uppercase; } .prov .edit { color:var(--accent); font-size:12px; white-space:nowrap; }
  details summary { cursor:pointer; }
  .needs { background:var(--warn); } .needs.zero { background:var(--panel2); color:var(--muted); }
  #attdlg { width:min(960px,94vw); }
  #attdlg .dlg { overflow:hidden; }
  #attdlg .top { padding:14px 18px; }
  #attdlg .notes { flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; }
  .att { border:2px solid var(--line); background:var(--panel2); padding:14px; margin-bottom:14px; box-shadow:3px 3px 0 var(--ink); overflow-wrap:anywhere; }
  .att .att-head { display:flex; gap:12px; align-items:center; }
  .att .att-heading { flex:1; min-width:0; }
  .att h4 { margin:4px 0; font-size:15px; }
  .att .t { line-height:1.6; margin:12px 0; }
  .att .t pre { overflow:auto; white-space:pre-wrap; }
  .att .att-compose { border-top:1px solid var(--line); padding-top:12px; }
  .att .att-compose label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .att textarea { width:100%; min-height:82px; resize:vertical; }
  .att .att-compose .row { margin-top:8px; gap:10px; flex-wrap:wrap; }
  .att .att-status { font-size:12px; }
  .att details { margin:12px 0; font-size:13px; }
  .att .att-context { border-left:2px solid var(--line); padding-left:12px; margin-top:12px; }
  .att .att-context article { border-bottom:1px solid var(--line); padding:8px 0; }
  .att .att-context article.request { border-left:3px solid var(--warn); padding-left:8px; }
  .att.resolved { border-color:var(--muted); }
  #attstatus { min-height:18px; margin:8px 0 0; }
  #attmore { margin:4px 0 12px; }
  .live { border-top:3px solid var(--line); padding:10px 18px; max-height:260px; overflow:auto; background:#0d1120; font-size:13px; }
  .live .l { padding:4px 0; border-bottom:1px dashed var(--line); white-space:pre-wrap; word-break:break-word; line-height:1.45; }
  .live .l.thinking { color:var(--pink); font-style:italic; } .live .l.tool { color:var(--cyan); font-family:var(--mono); font-size:12px; } .live .l.result { color:var(--muted); font-family:var(--mono); font-size:12px; }
  .live .l.error { color:var(--err); } .live .l.cycle { color:var(--warn); } .live .l.text { color:var(--text); }
  .live .k { color:var(--muted); font-size:10.5px; font-family:var(--mono); margin-right:6px; }
  #office { width:100%; height:calc(100vh - 54px - 32px); display:block; image-rendering: pixelated; image-rendering: crisp-edges; background:#0a0c14; border:3px solid var(--line); box-shadow:4px 4px 0 var(--ink); }
  .viewbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  main.offices section { max-width:none; padding:12px 16px; } .gridbar { margin-bottom:10px; } .gridbar h2 { margin:0; } .gridbar select.inline { width:auto; }
  #ogrid { display:grid; gap:10px; }
  .ocell { display:flex; flex-direction:column; min-height:0; min-width:0; border:3px solid var(--line); background:var(--panel); box-shadow:4px 4px 0 var(--ink); }
  .ocellbar { display:flex; align-items:center; gap:8px; height:30px; padding:0 8px; border-bottom:2px solid var(--line); white-space:nowrap; overflow:hidden; }
  .ocellbar .oname { font-weight:700; color:var(--text); text-decoration:none; overflow:hidden; text-overflow:ellipsis; min-width:0; } .ocellbar .oname:hover { color:var(--accent); } .ocellbar .owork { margin-left:auto; }
  .obox { flex:1; min-height:0; position:relative; }
  canvas.officecell { position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#0a0c14; cursor:pointer; }
  .livelog { background:#070a12; border:2px solid var(--line); padding:8px 10px; font: 11.5px/1.5 var(--mono); max-height:56vh; overflow:auto; white-space:pre-wrap; word-break:break-word; color:var(--text); margin-top:10px; }
  .livelog .t { color:var(--muted); margin-right:8px; } .livelog .l { display:block; }
  .lang { width:auto; flex:0 0 auto; background:var(--panel2); color:var(--text); border:2px solid var(--ink); font: 600 12px/1 var(--sans); padding:5px 6px; margin-left:8px; }
  header .row { flex-wrap:nowrap; flex-shrink:0; }

    (pool ? ' · <span title="the sessions share one KV pool; each counts on its share, so agents compact before they crowd each other out">' + Math.round(pool / 1024) + 'K pool shared</span>' : '');
  if (!st.details) return '<span style="color:var(--ok)">✓</span> <span class="mono">' + esc(st.models.join(", ")) + '</span>' + capacity(st.context, st.slots, st.pool);

// ---------------------------------------------------------------- mention autocomplete
function attachMentions(textarea, names) {
  const wrap = textarea.parentElement;
  let box = null, items = [], sel = 0, range = null;
  const close = () => { if (box) { box.remove(); box = null; } };
  const candidates = () => ["all", "human", ...names.filter(n => n !== "human")];
  const current = () => {
    const pos = textarea.selectionStart, text = textarea.value.slice(0, pos);
    const m = text.match(/(^|[^\w@])@([a-z0-9-]*)$/i);
    return m ? { start: pos - m[2].length - 1, end: pos, q: m[2].toLowerCase() } : null;
  };
  const draw = () => {
    range = current();
    if (!range) return close();
    items = candidates().filter(n => n.startsWith(range.q));
    if (!items.length) return close();
    sel = Math.min(sel, items.length - 1);
    if (!box) { box = document.createElement("div"); box.className = "mention-box"; wrap.appendChild(box); }
    box.style.left = "8px"; box.style.top = (textarea.offsetTop + textarea.offsetHeight + 4) + "px";
    box.innerHTML = items.map((n, i) => '<div data-i="' + i + '" class="' + (i === sel ? "sel" : "") + '">' + avatar(n, "sm") + '<b>@' + esc(n) + '</b><span class="role">' + esc(n === "all" ? "everyone" : n === "human" ? "you" : (roleOf[n] || "")) + '</span></div>').join("");
  };
  const accept = (i) => { if (!range) return; const n = items[i], v = textarea.value; textarea.value = v.slice(0, range.start) + "@" + n + " " + v.slice(range.end); const p = range.start + n.length + 2; textarea.setSelectionRange(p, p); textarea.focus(); close(); };
  textarea.addEventListener("input", () => { sel = 0; draw(); });
  textarea.addEventListener("keydown", (e) => {
    if (!box) return;
    if (e.key === "ArrowDown") { sel = (sel + 1) % items.length; draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = (sel - 1 + items.length) % items.length; draw(); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === "Tab") { accept(sel); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  textarea.addEventListener("blur", () => setTimeout(close, 150));
  wrap.addEventListener("mousedown", (e) => { const row = e.target.closest("[data-i]"); if (row && box && box.contains(row)) { e.preventDefault(); accept(Number(row.dataset.i)); } });
}

// header counters: usage-limit pauses / resumes, and how long we have been waiting for tokens
let countersArgs = null;

function drawCounters(lim, totals) {
  countersArgs = [lim, totals];
  const el = $("#hcounters");
  const wid = boardId;
  const est = state && state.estimate ? ' <span class="hint">/ est ' + fmtNum(state.estimate.tokens) + (state.estimate.cost_usd ? ' · ' + money(state.estimate.cost_usd) : '') + '</span>' : "";
  const tot = totals ? '<span class="c" title="uncached input + output + cache reads + cache writes, counted once; costs may be partial or estimated">Σ <b>' + fmtNum(totals.tokens) + '</b> tok · <b>' + usageCost(totals.cost_usd, totals.usage_cost) + '</b>' + est + '</span>' : "";
  const limited = Object.entries(lim && lim.paused ? lim.backends || {} : {});
  el.classList.toggle("limited", limited.length > 0);
  if (!limited.length) {
    el.innerHTML = tot + (lim && lim.pause_count ? '<span class="c" title="times the team was paused by a usage limit / resumed by the watchdog">limit pauses <b>' + lim.pause_count + '</b> · resumes <b>' + lim.resume_count + '</b></span>' : '');
    return;
  }
  // A usage limit: a short chip per limited backend (one for all of them on a narrow window). The details are in its
  // tooltip and a click asks the backend whether the limit has lifted, so the header keeps its width.
  const since = (l) => Math.max(0, Math.round((Date.now() - new Date(l.since)) / 1000));
  const detail = (b, l) => [(BLABEL[b] || b) + ": " + (l.reason || "usage limit"), "limited for " + fmtDur(since(l)),
    l.resets_at ? "resets " + clock(new Date(l.resets_at * 1000).toISOString()) + (l.next_probe_at ? " · auto-check " + clock(new Date(l.next_probe_at * 1000).toISOString()) : "") : "no reset time announced",
    l.last_probe ? "last check " + when(l.last_probe) : ""].filter(Boolean).join("\n");
  const tail = "\nlimit pauses " + lim.pause_count + " · resumes " + lim.resume_count + (lim.gate ? "\nthe master resumes first, then releases the team" : "") + "\n(click to check now)";
  const chip = (backends, label, secs, title) => '<button class="c lim limchip" data-backends="' + esc(backends.join(",")) + '" title="' + esc(title + tail) + '">⏳ ' + esc(label) + ' <b>' + fmtDurShort(secs) + '</b></button>';
  const chips = limited.length > 1 && window.matchMedia("(max-width: 1000px)").matches
    ? chip(limited.map(([b]) => b), limited.length + " limits", Math.max(...limited.map(([, l]) => since(l))), limited.map(([b, l]) => detail(b, l)).join("\n\n"))
    : limited.map(([b, l]) => chip([b], SHORT_BACKEND[b] || b, since(l), detail(b, l))).join("");
  el.innerHTML = chips + tot;
  el.querySelectorAll(".limchip").forEach(btn => btn.onclick = async () => {
    const label = btn.innerHTML; btn.disabled = true; btn.textContent = "Checking…";
    try {
      const rs = await Promise.all(btn.dataset.backends.split(",").map(b => api("/api/workspaces/" + wid + "/probe-limit", { backend: b })));
      if (rs.some(r => !r.ok)) { btn.textContent = "Still limited"; setTimeout(() => { btn.disabled = false; btn.innerHTML = label; }, 3000); }
    } catch (err) { alert(err.message); btn.disabled = false; btn.innerHTML = label; }
  });
}

let shownThreads = null, pendingRefresh = false, chatRestore = null;

    for (const m of data.messages) if (!messages.has(m.id)) { messages.set(m.id, m); changed = true; }
    if (changed) {
      box.innerHTML = [...messages.values()].sort((a,b) => a.id - b.id).map(m => '<article style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="meta"><b>' + esc(m.role === "human" ? "You" : m.role === "tool" ? "Recovery action" : "Watchdog") + '</b> · ' + esc(m.target) + ' · ' + esc(m.model) + ' · ' + when(m.created_at) + '</div><div class="t">' + md(m.body) + '</div></article>').join("");
      if (earlier) box.scrollTop += box.scrollHeight - oldHeight;
      else if (bottom) box.scrollTop = box.scrollHeight;
    }
    if (!messages.size) box.innerHTML = '<p class="hint">Your conversation with the watchdog will appear here.</p>';
    $("#wdolder", dlg).disabled = !messages.size || Math.min(...messages.keys()) <= 1 || (earlier && data.messages.length < 100);
    $("#wdsend", dlg).disabled = busy || sending || !$("#wdmodel", dlg).value;
    status(busy ? "Watchdog is working…" : "Ready");
  }
  async function poll() {
    if (!active()) return;
    try { const data = await api("/api/w/" + id + "/watchdog"); if (active()) render(data); }
    catch (err) { status(err.message); }
    if (active()) timer = setTimeout(poll, 2000);
  }
  try {
    const [data, catalog] = await Promise.all([api("/api/w/" + id + "/watchdog"), api("/api/models")]);
    if (!active()) return;
    MODELS = catalog.models;
    const selection = data.selection || {};
    const model = MODELS.some(m => m.id === selection.model) ? selection.model : MODELS[0]?.id || "";
    $("#wdmodel", dlg).innerHTML = modelOptions(model, MODELS);
    $("#wdeffort", dlg).innerHTML = effortOptions(model, selection.effort || "high");
    bindEfforts($("#wdmodel", dlg), $("#wdeffort", dlg));
    $("#wdtarget", dlg).innerHTML = data.agents.map(a => '<option value="' + esc(a.name) + '"' + (a.name === (selection.target || "master") ? ' selected' : '') + '>' + esc(a.name + " · " + a.title) + '</option>').join("");
    render(data);
    if (!model) status("Configure a model provider to use the watchdog.");
    timer = setTimeout(poll, 2000);
  } catch (err) { status(err.message); $("#wdsend", dlg).disabled = true; }
  $("#wdolder", dlg).onclick = async () => {
    if (loading || !messages.size) return;
    loading = true;
    try { const data = await api("/api/w/" + id + "/watchdog?before=" + Math.min(...messages.keys())); if (active()) render(data, true); }
    catch (err) { status(err.message); }
    finally { loading = false; }
  };
  $("#wdform", dlg).onsubmit = async event => {
    event.preventDefault();
    if (busy || sending) return;
    const input = $("#wdinput", dlg), message = input.value.trim();
    if (!message) return;
    sending = true; $("#wdsend", dlg).disabled = true;
    try {
      const data = await api("/api/workspaces/" + id + "/watchdog", {message, model: $("#wdmodel", dlg).value, effort: $("#wdeffort", dlg).value, target: $("#wdtarget", dlg).value});
      if (active()) { input.value = ""; render(data); }
    } catch (err) { status(err.message); }
    finally { sending = false; if (active()) $("#wdsend", dlg).disabled = busy || !$("#wdmodel", dlg).value; }
  };
}

// ---------------------------------------------------------------- agent dialog
let dlgTimer = null;
let liveCursor = 0;
async function openAgent(id, name) {
  const dlg = $("#agentdlg");
  liveCursor = 0;
  const spec = state.agents.find(a => a.name === name) || { name, title: "", brief: "", role: "" };
  const live = spec.live || {}, st = live.status || spec.status;
  const brief = spec.brief.split("\n\nModel choice:")[0], why = (spec.brief.split("\n\nModel choice:")[1] || "").trim();
  dlg.innerHTML = '<div class="dlg"><div class="top">' + avatar(name, "lg", isWorking(st)) + '<div class="body"><div class="title"><h3>@' + esc(name) + '</h3><span class="pill">' + esc(spec.title) + '</span><span class="pill ' + (isWorking(st) ? "on" : /paused|waiting/.test(st) ? "off" : /error|crashed/.test(st) ? "err" : "") + '" id="dlgstatus">' + esc(st) + '</span><button class="small secondary" id="dlgclose" style="margin-left:auto">Close</button></div>' +
    '<div class="meta" style="margin-top:6px">' + (isWorking(st) ? '<span class="dots"></span> ' : '') + '<span id="dlgtask">' + esc(live.task || "") + '</span></div>' +
    (spec.personality && spec.role !== "master" ? '<p style="margin:8px 0 0"><i>' + esc(spec.personality) + '</i></p>' : '') + '</div></div>' +
    '<div class="tiles" id="tiles"></div>' +
    '<div class="cols"><div><h2>Role</h2><p><b>' + esc(spec.title) + '</b> <span class="meta">(' + esc(spec.role) + ')</span></p><p>' + esc(brief) + '</p>' + (why ? '<p class="meta"><i>Model choice: ' + esc(why) + '</i></p>' : '') + (spec.estimated_cycles ? '<p class="meta">Estimated ~' + spec.estimated_cycles + ' cycles × ~' + fmtNum(spec.tokens_per_cycle) + ' tokens</p>' : '') +
    (state.approved && spec.status !== "retired" ? '<h2>Model</h2><div class="row modelctl"><select id="dlgmodel">' + modelOptions(spec.model || "", MODELS, "backend default") + '</select><select id="dlgeffort" class="inline">' + effortOptions(spec.model, spec.effort || (spec.role === "master" || spec.role === "team-lead" ? "xhigh" : "high")) + '</select><button class="small" id="dlgapply">Apply</button></div><p class="hint" id="dlgmodelhint">Takes effect from its next cycle.</p>' : '') + '</div>' +
    '<div><h2>Current task</h2><p id="dlgcur">—</p><h2>Last cycle</h2><p id="dlglast" class="meta">—</p><h2>Uncommitted files</h2><p id="dlgfiles" class="meta">—</p></div></div>' +
    '<div class="tabs"><h2 style="margin:0">Live</h2><span class="hint" id="livehint">what the model is doing right now: its thinking, what it says, and the tools it runs (newest at the bottom)</span></div><div class="live" id="dlglive"><p class="hint">Loading…</p></div>' +
    '<div class="notes" id="dlgcycles"><h2>Recent cycles</h2><p class="hint">Loading…</p></div></div>';
  $("#dlgclose", dlg).onclick = () => dlg.close();
  bindEfforts($("#dlgmodel", dlg), $("#dlgeffort", dlg));
  if ($("#dlgapply", dlg)) $("#dlgapply", dlg).onclick = async () => {
    const btn = $("#dlgapply", dlg); btn.disabled = true;
    try { await api("/api/w/" + id + "/agents/" + name + "/model", { model: $("#dlgmodel", dlg).value || "default", effort: $("#dlgeffort", dlg).value }); $("#dlgmodelhint", dlg).textContent = "Saved. Takes effect from its next cycle."; if (boardRefresh) boardRefresh(); }
    catch (err) { alert(err.message); }
    btn.disabled = false;
  };
  const pull = async () => {
    let d; try { d = await api("/api/w/" + id + "/agents/" + name + "/activity?after=" + Math.max(0, liveCursor - 60)); } catch (err) { $("#dlgcycles", dlg).innerHTML = '<p class="error">' + esc(err.message) + '</p>'; return; }
    const live = $("#dlglive", dlg), liveBottom = live.scrollHeight - live.scrollTop - live.clientHeight < 40 || !live.querySelector(".l");
    const shown = (d.entries || []).filter(e => ["thinking", "text", "tool", "error", "cycle", "result"].includes(e.kind)).slice(-60);
    live.innerHTML = shown.length ? shown.map(e => '<div class="l ' + esc(e.kind) + '"><span class="k">' + clock(e.at) + '</span>' + (e.kind === "thinking" ? "💭 " : e.kind === "tool" ? "⚙ " : e.kind === "result" ? "↳ " : "") + esc(e.text.length > 700 ? e.text.slice(0, 700) + "…" : e.text) + '</div>').join("") : '<p class="hint">Nothing yet — the agent has not started a cycle.</p>';
    if (liveBottom) live.scrollTop = live.scrollHeight;
    liveCursor = d.cursor || 0;
    const info = d.agent, lv = d.live || {}, u = info.usage || {};
    const tokens = tokenTotal(u);
    const pct = info.context_limit ? Math.min(100, Math.round(100 * (info.context_tokens || 0) / info.context_limit)) : 0;
    $("#tiles", dlg).innerHTML = [["Model", esc(info.model)], ["Effort", esc(info.effort)], ["Backend", esc(info.backend)], ["Cycles", info.cycles + (spec.estimated_cycles ? " / ~" + spec.estimated_cycles : "") + (info.reviews ? " · " + info.reviews + " rev" : "")],
      ["Tokens", fmtNum(tokens) + (info.usage_history_incomplete ? ' · <span style="display:inline">' + esc(tr('History incomplete') || 'History incomplete') + '</span>' : '')], ["Cost", usageCost(u.cost_usd, info.usage_cost)],
      ["Uncached input", fmtNum(u.input)], ["Output tokens", fmtNum(u.output)], ["Cache reads", fmtNum(u.cache_read)], ["Cache writes", fmtNum(u.cache_write)],
      ["Context", pct + '%<div class="bar' + (pct > 85 ? " hot" : pct > 60 ? " warn" : "") + '"><i style="width:' + pct + '%"></i></div>'], ["Compactions", info.compactions || 0]].map(([k, v]) => '<div class="tile"><span>' + k + '</span><b>' + v + '</b></div>').join("");
    $("#dlgstatus", dlg).textContent = lv.status || ""; $("#dlgtask", dlg).textContent = lv.task || "";
    $("#dlgcur", dlg).textContent = info.current_task || "—"; $("#dlglast", dlg).textContent = info.last_summary || "—";
    $("#dlgfiles", dlg).textContent = info.touched_files && info.touched_files.length ? info.touched_files.join(", ") : "none";
    const cycles = (d.journal || []).slice().reverse();
    $("#dlgcycles", dlg).innerHTML = '<h2>Recent cycles</h2>' + (cycles.length ? cycles.map(j => '<div class="card"><div class="meta">cycle ' + j.cycle + ' · ' + esc(j.kind) + ' · ' + when(j.at) + (j.commits && j.commits.length ? ' · commits ' + j.commits.map(esc).join(", ") : '') + '</div><div class="md">' + md(String(j.summary || "")) + '</div>' + (j.next ? '<div class="meta">next: ' + esc(j.next) + '</div>' : '') + '</div>').join("") : '<p class="hint">No cycles yet.</p>');
  };
  dlg.showModal();
  clearInterval(dlgTimer);
  await pull();
  dlgTimer = setInterval(() => { if (dlg.open) pull(); else clearInterval(dlgTimer); }, 2500);
  dlg.onclose = () => clearInterval(dlgTimer);
}

// ---------------------------------------------------------------- office view: a GBA-era Pokémon style office in colour, the team as sprites
// One renderer per project; the backend owns every scene and advances it without viewers.
const offices = {}, avatarOffice = makeOffice(null);                         // the board's avatars come from an office of their own
const office = {
  shown: null, grid: [],                                                     // the board's office, or the offices in the all-offices grid
  start(wid, st) { this.stopGrid(); if (this.shown && this.shown !== wid && offices[this.shown]) offices[this.shown].stop(); this.shown = wid; (offices[wid] = offices[wid] || makeOffice(wid)).start(st); },
  stop() { if (this.shown && offices[this.shown]) offices[this.shown].stop(); this.shown = null; this.stopGrid(); },
  startIn(wid, st, cell) { (offices[wid] = offices[wid] || makeOffice(wid)).start(st, cell); if (!this.grid.includes(wid)) this.grid.push(wid); },
  stopGrid() { for (const w of this.grid) if (offices[w]) offices[w].stop(); this.grid = []; },
  update(wid, st) { if (offices[wid]) offices[wid].update(st); },
  headshot: (name, role) => avatarOffice.headshot(name, role),
  debug: (wid) => offices[wid || office.shown] && offices[wid || office.shown]._debug(),
};
(() => { const sel = document.getElementById("lang"); if (!sel) return; sel.innerHTML = LANGS.map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join(""); sel.value = LANG; sel.onchange = () => setLang(sel.value); document.documentElement.lang = LANG; translateNode(document.body); })();
route();
</script>
