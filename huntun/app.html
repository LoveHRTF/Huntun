<html lang="en">
<head>

<title>Huntun</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>

  * { box-sizing: border-box; }
  html, body { height:100%; }

  h3 { font: 600 15px/1.35 var(--sans); margin:0 0 6px; }

  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button.secondary { background:var(--panel2); color:var(--text); } button.danger { background:var(--err); color:var(--ink); } button.ok { background:var(--ok); }

  textarea, input, select { width:100%; background:#070a12; color:var(--text); border:2px solid var(--line); padding:8px 10px; font: 14px/1.4 var(--sans); }
  textarea:focus, input:focus, select:focus { outline:none; border-color:var(--accent); }

  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; } @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .plan-agent.removed { opacity:.4; } .plan-agent .brief { line-height:1.5; } .plan-agent .why { color:var(--muted); font-size:12.5px; margin-top:6px; }

  .events .ev .t { min-width:0; line-height:1.4; } .events .ev b { color:var(--text); font-weight:600; }
  /* dialog */

  dialog::backdrop { background:rgba(0,0,0,.7); }
  .dlg { display:flex; flex-direction:column; height:100%; }
  .dlg .top { display:flex; gap:16px; padding:16px 18px; border-bottom:3px solid var(--line); align-items:flex-start; }
  .dlg .top .body { flex:1; min-width:0; }
  .dlg .title { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .dlg .title h3 { margin:0; font-size:18px; color:var(--accent); }

  .tile { border:2px solid var(--line); background:var(--panel); padding:8px 10px; box-shadow: 3px 3px 0 var(--ink); min-width:0; }
  .tile span { display:block; font: 600 9px/1.4 var(--sans); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .tile b { font-family:var(--mono); font-size:15px; color:#fff; font-weight:600; word-break:break-word; }
  .dlg .cols { display:grid; grid-template-columns: 1fr 1fr; border-bottom:3px solid var(--line); }

  .dlg .cols p { margin:4px 0; line-height:1.5; } .dlg .cols ul { margin:4px 0; padding-left:18px; }
  .dlg .tabs { display:flex; gap:6px; padding:10px 18px; border-bottom:3px solid var(--line); align-items:center; }
  .tabs button { background:var(--panel2); color:var(--muted); } .tabs button.on { background:var(--accent); color:var(--ink); }
  .dlg .log { flex:1; overflow:auto; padding:10px 18px; font-family:var(--mono); font-size:12px; }
  .dlg .log .e { padding:6px 8px; border-left:4px solid var(--line); margin-bottom:6px; white-space:pre-wrap; word-break:break-word; background:#070a12; line-height:1.45; }
  .dlg .log .e.tool { border-color:var(--cyan); } .dlg .log .e.result { color:var(--muted); } .dlg .log .e.text { border-color:var(--ok); }
  .dlg .log .e.cycle { border-color:var(--warn); } .dlg .log .e.error { border-color:var(--err); } .dlg .log .e.prompt { border-color:var(--pink); color:var(--muted); }
  .dlg .log .e .k { color:var(--muted); font-size:10.5px; margin-right:8px; }
  .notes { flex:1; overflow:auto; padding:10px 18px; }
  details summary { cursor:pointer; }

</style>

<body>
<header>
  <h1><a href="#/">HUNTUN</a></h1>

<main id="main"><section id="view"></section></main>
<dialog id="agentdlg"></dialog>
<script>
const $ = (s, el) => (el || document).querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const api = async (path, body, method) => {
  const r = await fetch(path, body === undefined ? {} : { method: method || "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
};
function md(src) {
  let s = esc(src);
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => "<pre><code>" + c + "</code></pre>");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/^### (.*)$/gm, "<h4>$1</h4>").replace(/^## (.*)$/gm, "<h3>$1</h3>").replace(/^# (.*)$/gm, "<h3>$1</h3>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>");
  s = s.replace(/^(?:- |\* )(.*)$/gm, "<li>$1</li>").replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
  s = s.replace(/(^|[^\w@])@([a-z0-9][a-z0-9-]*)/gi, '$1<span class="mention">@$2</span>');
  s = s.replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
  return s;
}
const when = (iso) => { if (!iso) return ""; const d = new Date(iso); const m = (Date.now() - d) / 60000; if (m < 1) return "just now"; if (m < 60) return Math.floor(m) + "m ago"; if (m < 1440) return Math.floor(m/60) + "h ago"; return d.toLocaleString(); };
const clock = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "";
const fmtNum = (n) => { n = Number(n || 0); return n >= 1e6 ? (n/1e6).toFixed(2) + "M" : n >= 1e3 ? (n/1e3).toFixed(1) + "k" : String(Math.round(n)); };
const money = (n) => "$" + Number(n || 0).toFixed(2);
const statePill = (w) => {
  if (w.state === "planning" || w.state === "loading" || w.state === "clarifying") return '<span class="pill busy">' + esc(w.state) + '…</span>';
  if (w.state === "error") return '<span class="pill err">error</span>';
  if (w.state === "goal_proposed") return '<span class="pill busy">confirm goal</span>';
  if (!w.initialized) return '<span class="pill">not set up</span>';
  if (!w.approved) return '<span class="pill busy">awaiting approval</span>';

};
let MODELS = [{ id: "claude-opus-5", backend: "claude-code", vendor: "anthropic" }, { id: "claude-sonnet-5", backend: "claude-code", vendor: "anthropic" }, { id: "claude-haiku-4-5", backend: "claude-code", vendor: "anthropic" }], PERSONAS = [];
const EFFORTS = ["low", "medium", "high", "xhigh", "max"], BLABEL = { api: "Anthropic API", "claude-code": "Claude Code", codex: "OpenAI Codex" };
const modelOptions = (selected) => { const groups = {}; for (const m of MODELS) (groups[m.backend] = groups[m.backend] || []).push(m); const known = MODELS.some(m => m.id === selected);
  return Object.entries(groups).map(([b, ms]) => '<optgroup label="' + esc(BLABEL[b] || b) + '">' + ms.map(m => '<option value="' + esc(m.id) + '"' + (m.id === selected ? " selected" : "") + '>' + esc(m.id) + '</option>').join("") + '</optgroup>').join("") + (selected && !known ? '<option selected>' + esc(selected) + '</option>' : ''); };

// ---------------------------------------------------------------- pixel avatars: a 5x5 mirrored sprite from the name
const ROLE_ICON = { master: "👑", "team-lead": "🧭", "scrum-master": "📋", backend: "⚙️", frontend: "🖼️", fullstack: "🧩", "ux-researcher": "🔍", "ui-designer": "🎨", qa: "🧪", "ml-engineer": "🧠", "data-scientist": "📊", devops: "🚀", "tech-writer": "✍️", security: "🛡️", "product-manager": "🎯", human: "🙂" };
const roleOf = {};
function hash(name) { let h = 2166136261; for (const c of name) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }

  if (spriteCache[name]) return spriteCache[name];
  let h = hash(name), bits = [];
  for (let i = 0; i < 15; i++) { bits.push((h >> (i % 31)) & 1); h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0; }
  const hue = hash(name + "hue") % 360, fg = name === "human" ? "hsl(150,70%,55%)" : "hsl(" + hue + ",80%,62%)", bg = name === "human" ? "hsl(150,40%,18%)" : "hsl(" + hue + ",45%,18%)";
  let rects = "";

}
function avatar(name, size, working) {
  const role = name === "human" ? "human" : (roleOf[name] || "");
  return '<span class="av ' + (size || "") + (working ? " working" : "") + '" title="@' + esc(name) + (role ? " · " + esc(role) : "") + '">' + sprite(name) + (ROLE_ICON[role] ? '<span class="badge">' + ROLE_ICON[role] + '</span>' : '') + '</span>';
}
const isWorking = (st) => /^(working|resuming)/.test(st || "");

let timer = null;

let browseTimer = null, browseSeq = 0;
function browseTo(path, typed) {
  clearTimeout(browseTimer);
  const seq = ++browseSeq;
  browseTimer = setTimeout(async () => {
    let info;
    try { info = await api("/api/fs?path=" + encodeURIComponent(path || "/")); } catch (err) { $("#pathinfo").textContent = err.message; return; }
    if (seq !== browseSeq || !$("#browser")) return;
    let prefix = "";
    if (!info.exists && typed) {
      const cut = path.lastIndexOf("/");
      prefix = path.slice(cut + 1).toLowerCase();
      try { info = await api("/api/fs?path=" + encodeURIComponent(path.slice(0, cut) || "/")); } catch (err) { return; }
      if (seq !== browseSeq) return;
    }
    if (!typed) { browserPath = info.path; $("#path").value = info.path; }
    const base = info.path.replace(/\/$/, "");
    const rows = [];
    if (!prefix && info.parent) rows.push('<div class="up" data-path="' + esc(info.parent) + '">↑ ..</div>');
    for (const d of info.dirs) if (!prefix || d.toLowerCase().startsWith(prefix)) rows.push('<div data-path="' + esc(base + "/" + d) + '">' + esc(d) + '/</div>');
    $("#browser").innerHTML = rows.join("") || '<div class="up">' + (prefix ? "(no matching directories)" : "(no subdirectories)") + '</div>';
    $("#pathinfo").textContent = prefix ? "keep typing, or click a directory" : !info.exists ? "directory does not exist" :
      (info.initialized ? "Huntun project (set up)" : (info.files ? info.files + " files" + (info.git ? ", git repo" : "") + " — will be inspected for planning" : "empty directory"));
  }, typed ? 200 : 0);
}

// ---------------------------------------------------------------- mention autocomplete
function attachMentions(textarea, names) {
  const wrap = textarea.parentElement;
  let box = null, items = [], sel = 0, range = null;
  const close = () => { if (box) { box.remove(); box = null; } };
  const candidates = () => ["all", "human", ...names.filter(n => n !== "human")];
  const current = () => {
    const pos = textarea.selectionStart, text = textarea.value.slice(0, pos);
    const m = text.match(/(^|[^\w@])@([a-z0-9-]*)$/i);
    return m ? { start: pos - m[2].length - 1, end: pos, q: m[2].toLowerCase() } : null;
  };
  const draw = () => {
    range = current();
    if (!range) return close();
    items = candidates().filter(n => n.startsWith(range.q));
    if (!items.length) return close();
    sel = Math.min(sel, items.length - 1);
    if (!box) { box = document.createElement("div"); box.className = "mention-box"; wrap.appendChild(box); }
    box.style.left = "8px"; box.style.top = (textarea.offsetTop + textarea.offsetHeight + 4) + "px";
    box.innerHTML = items.map((n, i) => '<div data-i="' + i + '" class="' + (i === sel ? "sel" : "") + '">' + avatar(n, "sm") + '<b>@' + esc(n) + '</b><span class="role">' + esc(n === "all" ? "everyone" : n === "human" ? "you" : (roleOf[n] || "")) + '</span></div>').join("");
  };
  const accept = (i) => { if (!range) return; const n = items[i], v = textarea.value; textarea.value = v.slice(0, range.start) + "@" + n + " " + v.slice(range.end); const p = range.start + n.length + 2; textarea.setSelectionRange(p, p); textarea.focus(); close(); };
  textarea.addEventListener("input", () => { sel = 0; draw(); });
  textarea.addEventListener("keydown", (e) => {
    if (!box) return;
    if (e.key === "ArrowDown") { sel = (sel + 1) % items.length; draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = (sel - 1 + items.length) % items.length; draw(); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === "Tab") { accept(sel); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  textarea.addEventListener("blur", () => setTimeout(close, 150));
  wrap.addEventListener("mousedown", (e) => { const row = e.target.closest("[data-i]"); if (row && box && box.contains(row)) { e.preventDefault(); accept(Number(row.dataset.i)); } });
}

    $("#agents").onclick = (e) => { const el = e.target.closest("[data-agent]"); if (el) openAgent(id, el.dataset.agent); };

// header counters: usage-limit pauses / resumes, and how long we have been waiting for tokens
function drawCounters(lim, totals) {
  const el = $("#hcounters");
  const wid = boardId;
  const est = state && state.estimate ? ' <span class="hint">/ est ' + fmtNum(state.estimate.tokens) + (state.estimate.cost_usd ? ' · ' + money(state.estimate.cost_usd) : '') + '</span>' : "";
  const tot = totals ? '<span class="c" title="total tokens (input + output + cached) and list-price cost across all agents, and the master\'s estimate for the whole project">Σ <b>' + fmtNum(totals.tokens) + '</b> tok · <b>' + money(totals.cost_usd) + '</b>' + est + '</span>' : "";
  if (!lim || (!lim.pause_count && !lim.paused)) { el.innerHTML = tot; return; }
  let wait = "";
  for (const [b, l] of Object.entries(lim.backends || {})) {
    const secs = Math.max(0, Math.round((Date.now() - new Date(l.since)) / 1000));
    const sched = l.resets_at ? ' · resets ' + clock(new Date(l.resets_at * 1000).toISOString()) + (l.next_probe_at ? ' · auto-check ' + clock(new Date(l.next_probe_at * 1000).toISOString()) : '') : ' · no reset time announced';
    wait += '<span class="c lim" title="' + esc(l.reason || "") + '">⏳ ' + esc(BLABEL[b] || b) + ' limit <b>' + fmtDur(secs) + '</b>' + sched + (l.last_probe ? ' · last check ' + when(l.last_probe) : '') + '</span><button class="small probebtn" data-backend="' + esc(b) + '">Check ' + esc(b) + '</button>';
  }
  el.innerHTML = tot + wait + '<span class="c" title="times the team was paused by a usage limit / resumed by the watchdog">limit pauses <b>' + lim.pause_count + '</b> · resumes <b>' + lim.resume_count + '</b></span>' + (lim.gate ? '<span class="c lim">master resuming first…</span>' : '');
  el.querySelectorAll(".probebtn").forEach(b => b.onclick = async () => { const label = b.textContent; b.disabled = true; b.textContent = "Checking…"; try { const r = await api("/api/workspaces/" + wid + "/probe-limit", { backend: b.dataset.backend }); if (!r.ok) { b.textContent = "Still limited"; setTimeout(() => { b.disabled = false; b.textContent = label; }, 3000); } } catch (err) { alert(err.message); b.disabled = false; b.textContent = label; } });
}
const fmtDur = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60; return (h ? h + "h " : "") + (h || m ? m + "m " : "") + sec + "s"; };

    return '<div class="plan-agent" data-name="' + esc(a.name) + '">' + avatar(a.name, "lg") +
      '<div><div class="who"><b>@' + esc(a.name) + '</b><span class="pill">' + esc(a.title) + '</span></div><div class="brief">' + esc(brief) + '</div>' + (why ? '<div class="why">Why this model: ' + esc(why) + '</div>' : '') + (a.estimated_cycles ? '<div class="why">Estimate: ~' + a.estimated_cycles + ' cycles × ~' + fmtNum(a.tokens_per_cycle) + ' tokens' + estFor(a.name) + '</div>' : '') +
      '<div class="why" style="margin-top:8px"><label>Personality</label><select class="pers">' + ["human", "work"].map(g => '<optgroup label="' + (g === "human" ? "People" : "Working styles") + '">' + PERSONAS.filter(pp => (pp.group || "work") === g).map(pp => '<option value="' + esc(pp.id) + '"' + (pp.id === (a.personality_preset || "") ? " selected" : "") + '>' + esc(pp.name) + '</option>').join("") + '</optgroup>').join("") + '<option value="custom"' + (!PERSONAS.some(pp => pp.id === a.personality_preset) ? " selected" : "") + '>Custom…</option></select>' +
      '<textarea class="perstext" style="min-height:56px;margin-top:6px" placeholder="Describe temperament, board voice, and working style">' + esc(a.personality) + '</textarea></div></div>' +
      '<div class="ctl"><label>Model</label><select class="mdl">' + modelOptions(a.model) + '</select>' + (a.backend ? '<span class="hint">runs via ' + esc(BLABEL[a.backend] || a.backend) + '</span>' : '') +
      '<label>Effort</label><select class="eff">' + EFFORTS.map(e => '<option' + (e === (a.effort || "high") ? " selected" : "") + '>' + e + '</option>').join("") + '</select>' +
      '<button type="button" class="small danger rm">Remove</button></div></div>';
  }).join("");
  const e = state.estimate;
  const estFor = (n) => { const p = e && e.per_agent ? e.per_agent.find(x => x.name === n) : null; return p ? ' = ~' + fmtNum(p.tokens) + (p.cost_usd ? ' (' + money(p.cost_usd) + ')' : '') : ''; };
  const estBox = e ? '<div class="card"><h3>Estimate to finish</h3><p><b>' + fmtNum(e.tokens) + ' tokens</b>' + (e.cost_usd ? ' · about <b>' + money(e.cost_usd) + '</b> at list prices' : ' · cost not tracked on this backend') + ' · ' + e.cycles + ' agent cycles</p>' + (e.notes ? '<p class="hint">' + esc(e.notes) + '</p>' : '') + '<p class="hint">Removing agents or changing models below updates the estimate when you approve. The header shows actual spend against it while the team works.</p></div>' : '';
  box.innerHTML = '<p><a href="#/">← Projects</a></p><div class="card"><h3>Plan awaiting your approval</h3><p class="hint">The master proposed this team, with a model and effort per agent chosen for the role and the difficulty of its work. Adjust anything below, then approve. Or tell the master what to change and it will revise. Nothing runs until you approve.</p><p><b>Goal</b> — ' + esc(state.goal) + '</p>' + (state.definition_of_done ? '<p><b>Definition of done</b></p><ul>' + state.definition_of_done.split("\n").filter(Boolean).map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>' : '') + '</div>' +
    estBox + '<h2>Team</h2>' + cards +
    '<div class="plan-actions"><button class="ok" id="approvebtn">Approve plan</button><span class="hint">Agents load paused; press Start all afterwards.</span></div>' +
    '<form class="card" id="replanform"><label>Ask the master to revise</label><textarea id="feedback" style="min-height:56px" placeholder="e.g. Drop the UX researcher, use Sonnet for the backend engineer, add a second QA"></textarea><div class="row"><button class="secondary">Request changes</button></div></form>' +
    '<h2>Discussion</h2>';
  box.querySelectorAll(".plan-agent").forEach(card => {
    const sel = $(".pers", card), ta = $(".perstext", card);
    sel.onchange = () => { const pp = PERSONAS.find(x => x.id === sel.value); if (pp) ta.value = pp.text; };
    ta.oninput = () => { const pp = PERSONAS.find(x => x.id === sel.value); if (pp && ta.value.trim() !== pp.text) sel.value = "custom"; };
  });
  box.querySelectorAll(".rm").forEach(b => b.onclick = () => { const card = b.closest(".plan-agent"); card.dataset.remove = card.dataset.remove ? "" : "1"; card.classList.toggle("removed", !!card.dataset.remove); b.textContent = card.dataset.remove ? "Undo" : "Remove"; });
  $("#approvebtn").onclick = async () => {
    const agents = [...box.querySelectorAll(".plan-agent")].map(c => ({ name: c.dataset.name, model: $(".mdl", c).value, effort: $(".eff", c).value, remove: !!c.dataset.remove, personality_preset: $(".pers", c).value, personality: $(".perstext", c).value }));
    $("#approvebtn").disabled = true;
    try { await api("/api/workspaces/" + id + "/approve", { agents }); approvalKey = ""; state = null; route(); } catch (err) { alert(err.message); $("#approvebtn").disabled = false; }
  };
  $("#replanform").onsubmit = async (e) => { e.preventDefault(); const feedback = $("#feedback").value.trim(); if (!feedback) return; try { await api("/api/workspaces/" + id + "/replan", { feedback }); approvalKey = ""; } catch (err) { alert(err.message); } };
}

// threads: sortable list, each expands in place into a chat
function sortedThreads() {
  const ts = state.threads.filter(t => filterBy === "all" || (filterBy === "commits" ? !!t.commit_sha : !t.commit_sha));
  ts.sort((a, b) => sortBy === "posted" ? (b.created_at < a.created_at ? -1 : 1) : (b.last_activity < a.last_activity ? -1 : 1));
  return ts;
}
async function drawThreads(force) {
  if (!state) return;
  const id = boardId, base = "/api/w/" + id;
  const names = state.agents.filter(a => a.status !== "retired").map(a => a.name);
  const key = sortBy + "|" + filterBy + "|" + composing + "|" + openThread + "|" + JSON.stringify(state.threads.map(t => [t.id, t.last_activity, t.comment_count]));
  if (key !== threadKey || force) {
    threadKey = key;
    const draftT = $("#ntitle") ? $("#ntitle").value : "", draftB = $("#nbody") ? $("#nbody").value : "", draftC = $("#cbody") ? $("#cbody").value : "";
    const list = sortedThreads().map(t => {
      const open = t.id === openThread;
      return '<div class="thread' + (open ? " open" : "") + '" id="th' + t.id + '"><div class="head" data-open="' + t.id + '">' + avatar(t.author) + '<div class="txt"><div class="hrow"><span class="who"><b>@' + esc(t.author) + '</b><span class="meta">' + when(t.created_at) + (t.commit_sha ? ' · <code>' + esc(t.commit_sha) + '</code>' : '') + '</span></span><span class="count">' + t.comment_count + ' ' + (t.comment_count === 1 ? "reply" : "replies") + (t.last_activity !== t.created_at ? ' · ' + when(t.last_activity) : '') + ' ' + (open ? "▲" : "▼") + '</span></div>' +
        '<div class="title">' + esc(t.title) + (t.commit_sha ? '<span class="tag">commit</span>' : '') + '</div>' + (open ? '' : '<div class="snip">' + esc(t.snippet.replace(/[#*`>_-]+/g, " ").replace(/\s+/g, " ").trim()) + '</div>') + '</div></div>' +
        (!open && t.last_comments.length ? '<div class="replies">' + t.last_comments.map(c => '<div class="reply">' + avatar(c.author, "sm") + '<div class="snip"><b>@' + esc(c.author) + '</b> <span class="meta">' + when(c.created_at) + '</span><br>' + esc(c.snippet.replace(/\s+/g, " ")) + '</div></div>').join("") + '</div>' : '') +
        (open ? '<div class="chat" id="chat"><div class="messages" id="messages"><span class="hint">loading…</span></div><form class="compose" id="cform"><div class="compose-wrap"><textarea id="cbody" placeholder="Reply as @human. Type @ to tag an agent; they are woken up and decide whether to act."></textarea></div><div class="row"><button>Send</button><span class="hint">Cmd/Ctrl-Enter to send</span></div></form></div>' : '') + '</div>';
    }).join("") || '<p class="hint">' + (state.threads.length ? "Nothing matches this filter." : "No threads yet. Agents post here when they have something to discuss; you can also start one.") + '</p>';
    $("#threadsbox").innerHTML = '<div class="toolbar"><h2 style="margin:0">Threads</h2><button class="small" id="newbtn">' + (composing ? "Cancel" : "+ New thread") + '</button><div class="sort"><label>show</label><select id="filtersel"><option value="all"' + (filterBy === "all" ? " selected" : "") + '>everything</option><option value="discussions"' + (filterBy === "discussions" ? " selected" : "") + '>discussions</option><option value="commits"' + (filterBy === "commits" ? " selected" : "") + '>commit updates</option></select><label>sort</label><select id="sortsel"><option value="activity"' + (sortBy === "activity" ? " selected" : "") + '>last response</option><option value="posted"' + (sortBy === "posted" ? " selected" : "") + '>time posted</option></select></div></div>' +
      (composing ? '<form class="card composer top" id="newform"><input id="ntitle" placeholder="Title" autocomplete="off"><div class="compose-wrap"><textarea id="nbody" placeholder="Ask a question or add a requirement. Type @ to tag an agent."></textarea></div><div class="row"><button>Post thread</button><span class="hint">Tagged agents are woken up and decide whether to act.</span></div></form>' : '') +
      '<div id="threads">' + list + '</div>';
    $("#newbtn").onclick = () => { composing = !composing; drawThreads(true); if (composing) setTimeout(() => $("#ntitle") && $("#ntitle").focus(), 0); };
    $("#sortsel").onchange = (e) => { sortBy = e.target.value; localStorage.setItem("huntun.sort", sortBy); drawThreads(true); };
    $("#filtersel").onchange = (e) => { filterBy = e.target.value; localStorage.setItem("huntun.filter", filterBy); drawThreads(true); };
    $("#threads").onclick = (e) => { const h = e.target.closest("[data-open]"); if (!h) return; const tid = Number(h.dataset.open); openThread = openThread === tid ? null : tid; history.replaceState(null, "", "#/w/" + id + (openThread ? "/t/" + openThread : "")); chatKey = ""; drawThreads(true); };
    if (composing) {
      $("#ntitle").value = draftT; $("#nbody").value = draftB;
      attachMentions($("#nbody"), names);
      $("#newform").onsubmit = async (e) => { e.preventDefault(); const title = $("#ntitle").value.trim(), body = $("#nbody").value.trim(); if (!title || !body) return; const t = await api(base + "/threads", { title, body }); composing = false; openThread = t.id; sortBy = sortBy; chatKey = ""; state.threads.unshift({ id: t.id, title, author: "human", created_at: t.created_at, last_activity: t.created_at, comment_count: 0, snippet: body, last_comments: [], commit_sha: null }); drawThreads(true); };
    }
    if (openThread && $("#cbody")) {
      $("#cbody").value = draftC;
      attachMentions($("#cbody"), names);
      $("#cbody").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); $("#cform").requestSubmit(); } });
      $("#cform").onsubmit = async (e) => { e.preventDefault(); const body = $("#cbody").value.trim(); if (!body) return; await api(base + "/comments", { thread_id: openThread, body }); $("#cbody").value = ""; chatKey = ""; drawChat(); };
      chatKey = "";
    }
  }
  if (openThread) drawChat();
}
async function drawChat() {
  const box = $("#messages"); if (!box) return;
  let data; try { data = await api("/api/w/" + boardId + "/threads/" + openThread); } catch (err) { box.innerHTML = '<span class="error">' + esc(err.message) + '</span>'; return; }
  const key = openThread + ":" + data.comments.length + ":" + (data.comments.at(-1)?.id || 0);
  if (key === chatKey) return;
  chatKey = key;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60 || !box.querySelector(".msg");
  const bubble = (m, first) => '<div class="msg' + (m.author === "human" ? " me" : "") + (first ? " first" : "") + '">' + avatar(m.author) + '<div class="bubble"><div class="bhead"><b>@' + esc(m.author) + '</b><span class="meta">' + when(m.created_at) + '</span></div><div class="md">' + md(m.body) + '</div></div></div>';
  box.innerHTML = bubble(data.thread, true) + data.comments.map(c => bubble(c, false)).join("");
  if (atBottom) box.scrollTop = box.scrollHeight;
}

// ---------------------------------------------------------------- agent dialog
let dlgTimer = null;
async function openAgent(id, name) {
  const dlg = $("#agentdlg");
  const spec = state.agents.find(a => a.name === name) || { name, title: "", brief: "", role: "" };
  const live = spec.live || {}, st = live.status || spec.status;
  const brief = spec.brief.split("\n\nModel choice:")[0], why = (spec.brief.split("\n\nModel choice:")[1] || "").trim();
  dlg.innerHTML = '<div class="dlg"><div class="top">' + avatar(name, "lg", isWorking(st)) + '<div class="body"><div class="title"><h3>@' + esc(name) + '</h3><span class="pill">' + esc(spec.title) + '</span><span class="pill ' + (isWorking(st) ? "on" : /paused|waiting/.test(st) ? "off" : /error|crashed/.test(st) ? "err" : "") + '" id="dlgstatus">' + esc(st) + '</span><button class="small secondary" id="dlgclose" style="margin-left:auto">Close</button></div>' +
    '<div class="meta" style="margin-top:6px">' + (isWorking(st) ? '<span class="dots"></span> ' : '') + '<span id="dlgtask">' + esc(live.task || "") + '</span></div>' +
    (spec.personality && spec.role !== "master" ? '<p style="margin:8px 0 0"><i>' + esc(spec.personality) + '</i></p>' : '') + '</div></div>' +
    '<div class="tiles" id="tiles"></div>' +
    '<div class="cols"><div><h2>Role</h2><p><b>' + esc(spec.title) + '</b> <span class="meta">(' + esc(spec.role) + ')</span></p><p>' + esc(brief) + '</p>' + (why ? '<p class="meta"><i>Model choice: ' + esc(why) + '</i></p>' : '') + (spec.estimated_cycles ? '<p class="meta">Estimated ~' + spec.estimated_cycles + ' cycles × ~' + fmtNum(spec.tokens_per_cycle) + ' tokens</p>' : '') + '</div>' +
    '<div><h2>Current task</h2><p id="dlgcur">—</p><h2>Last cycle</h2><p id="dlglast" class="meta">—</p><h2>Uncommitted files</h2><p id="dlgfiles" class="meta">—</p></div></div>' +
    '<div class="notes" id="dlgcycles"><h2>Recent cycles</h2><p class="hint">Loading…</p></div></div>';
  $("#dlgclose", dlg).onclick = () => dlg.close();
  const pull = async () => {
    let d; try { d = await api("/api/w/" + id + "/agents/" + name + "/activity?after=0"); } catch (err) { $("#dlgcycles", dlg).innerHTML = '<p class="error">' + esc(err.message) + '</p>'; return; }
    const info = d.agent, lv = d.live || {}, u = info.usage || {};
    const tokens = (u.input || 0) + (u.output || 0) + (u.cache_read || 0);
    const pct = info.context_limit ? Math.min(100, Math.round(100 * (info.context_tokens || 0) / info.context_limit)) : 0;
    $("#tiles", dlg).innerHTML = [["Model", esc(info.model)], ["Effort", esc(info.effort)], ["Backend", esc(info.backend)], ["Cycles", info.cycles + (spec.estimated_cycles ? " / ~" + spec.estimated_cycles : "") + (info.reviews ? " · " + info.reviews + " rev" : "")],
      ["Tokens", fmtNum(tokens) + (u.cache_read ? ' <span style="display:inline">' + fmtNum(u.cache_read) + ' cached</span>' : "")], ["Cost", money(u.cost_usd)],
      ["Context", pct + '%<div class="bar' + (pct > 85 ? " hot" : pct > 60 ? " warn" : "") + '"><i style="width:' + pct + '%"></i></div>'], ["Compactions", info.compactions || 0]].map(([k, v]) => '<div class="tile"><span>' + k + '</span><b>' + v + '</b></div>').join("");
    $("#dlgstatus", dlg).textContent = lv.status || ""; $("#dlgtask", dlg).textContent = lv.task || "";
    $("#dlgcur", dlg).textContent = info.current_task || "—"; $("#dlglast", dlg).textContent = info.last_summary || "—";
    $("#dlgfiles", dlg).textContent = info.touched_files && info.touched_files.length ? info.touched_files.join(", ") : "none";
    const cycles = (d.journal || []).slice().reverse();
    $("#dlgcycles", dlg).innerHTML = '<h2>Recent cycles</h2>' + (cycles.length ? cycles.map(j => '<div class="card"><div class="meta">cycle ' + j.cycle + ' · ' + esc(j.kind) + ' · ' + when(j.at) + (j.commits && j.commits.length ? ' · commits ' + j.commits.map(esc).join(", ") : '') + '</div><div class="md">' + md(String(j.summary || "")) + '</div>' + (j.next ? '<div class="meta">next: ' + esc(j.next) + '</div>' : '') + '</div>').join("") : '<p class="hint">No cycles yet.</p>');
  };
  dlg.showModal();
  clearInterval(dlgTimer);
  await pull();
  dlgTimer = setInterval(() => { if (dlg.open) pull(); else clearInterval(dlgTimer); }, 4000);
  dlg.onclose = () => clearInterval(dlgTimer);
}
route();
</script>
</body>
</html>
